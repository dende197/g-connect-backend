    <style>
        /* Essential inline styles only — flat paint color to avoid a white/blank
           flash before style.css loads. The full glass-hero gradient/materiality
           lives in style.css so it isn't duplicated/overridden here. G-Connect
           now has a single visual style (Liquid Glass / navy) — there is no
           theme to resolve on boot anymore. */
        html, body {
            background-color: #0c1424;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
            color: #ffffff;
        }

        .liquid-glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            border-right: 1px solid rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        
        .liquid-pill {
            background-color: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 0.5px solid rgba(255, 255, 255, 0.15);
        }

        .deep-shadow {
            box-shadow: 0 10px 30px -10px rgba(0, 4, 16, 0.6);
        }

        .liquid-shadow {
            box-shadow: 
                0 8px 24px -6px rgba(0, 4, 16, 0.45), 
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.1);
        }

        .active-liquid-shadow {
            box-shadow: 
                0 15px 30px -8px rgba(41, 151, 255, 0.35), 
                0 4px 8px -2px rgba(41, 151, 255, 0.25);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #app-loader { position:fixed;top:0;left:0;right:0;bottom:0;background:#0c1424;z-index:99999;display:flex;align-items:center;justify-content:center;transition:opacity 0.22s ease-out; }
        .app-loader-ring{
            width:42px;height:42px;border-radius:50%;
            background:conic-gradient(from 0deg, #2997ff 0%, #60a5fa 50%, #93c5fd 100%);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
            animation:spin 0.85s cubic-bezier(.4,0,.2,1) infinite;
            margin:0 auto 20px;
        }
    </style>
